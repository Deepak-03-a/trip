<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TripTogether — 5-Day Itineraries</title><style>:root{--ink:#14213d;--muted:#68758a;--line:#e5eaf0;--soft:#f4f7fa;--blue:#1c5d9d}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif}.nav{height:70px;background:#14213d;color:#fff;padding:0 5vw;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950}.nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:45px 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:950;color:#526176}.tabs button.active{background:#14213d;color:#fff}.intro{margin:30px 0}.intro h1{font-size:42px;letter-spacing:-2px;margin:5px 0 10px}.lead{color:var(--muted);line-height:1.7}.days{display:grid;gap:14px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day button{width:100%;border:0;background:#fff;text-align:left;padding:20px;display:flex;justify-content:space-between;font-weight:950;color:var(--ink)}.daybody{display:none;padding:0 20px 20px;border-top:1px solid var(--line)}.day.open .daybody{display:block}.time{display:grid;grid-template-columns:85px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #eef1f4;font-size:12px}.time b{color:#1c5d9d}.check{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:12px}.check input{accent-color:#1c5d9d}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.box strong{font-size:22px}.back{display:inline-block;margin-top:25px;color:#1c5d9d;font-weight:950;text-decoration:none}@media(max-width:650px){.intro h1{font-size:34px}.summary{grid-template-columns:1fr}.time{grid-template-columns:65px 1fr}}
</style></head><body><nav class="nav"><div class="logo">🌍 TripTogether</div><a href="index.html">← Back to planner</a></nav><main class="wrap"><div class="intro"><div style="font-size:11px;letter-spacing:.14em;font-weight:950;color:#7b8798">5-DAY ITINERARIES</div><h1>Pick a plan, then make it yours</h1><p class="lead">Every option is exactly five days. Expand a day to see the flow, then tick activities as you lock the plan.</p></div><div class="tabs"><button class="active" onclick="show('manali',this)">🏔️ Manali + Kullu</button><button onclick="show('rajasthan',this)">🏛️ Rajasthan</button><button onclick="show('goa',this)">🏖️ Goa</button></div><div id="content"></div><a class="back" href="index.html">← Back to TripTogether</a></main><script>
const plans={manali:{title:'🏔️ Kullu + Manali',subtitle:'Mountains · snow · adventure · cafés',days:[['Day 1 · Arrive + Old Manali',[['09:00','Arrive / check-in'],['12:00','Lunch + rest'],['15:00','Old Manali walk + cafés'],['18:00','Mall Road / evening']],['Day 2 · Solang + Atal Tunnel',[['08:00','Breakfast'],['09:00','Solang Valley + adventure'],['13:00','Lunch'],['14:00','Atal Tunnel'],['17:30','Return to Manali']],['Day 3 · Sissu + Lahaul',[['08:00','Leave for Sissu'],['11:00','Waterfall / valley views'],['13:00','Lunch'],['15:00','Sissu walk + photos'],['18:30','Return']],['Day 4 · Jogini + Vashisht',[['08:00','Breakfast'],['09:30','Jogini Falls hike'],['13:00','Vashisht'],['16:00','Café / free time'],['19:00','Dinner']],['Day 5 · Kullu + departure',[['08:00','Check-out'],['10:00','Kullu / Beas River'],['13:00','Lunch'],['15:00','Start return journey']]]],pack:['Heavy jacket','Thermals','Gloves','Walking shoes','Sunglasses','Sunscreen']},rajasthan:{title:'🏛️ Udaipur + Kumbhalgarh',subtitle:'Lakes · palaces · forts · Aravallis',days:[['Day 1 · Udaipur old city',[['09:00','City Palace'],['12:00','Jagdish Temple + lunch'],['15:00','Lake Pichola boat ride'],['18:00','Gangaur Ghat sunset']],['Day 2 · Lakes + palace sunset',[['09:00','Saheliyon Ki Bari'],['11:00','Fateh Sagar Lake'],['14:00','Free time / cafés'],['16:00','Monsoon Palace'],['19:00','Dinner']],['Day 3 · Kumbhalgarh',[['07:30','Leave Udaipur'],['10:00','Kumbhalgarh Fort'],['13:00','Lunch'],['15:00','Aravalli viewpoints'],['18:00','Return to Udaipur']],['Day 4 · Ranakpur + local culture',[['08:00','Drive to Ranakpur'],['10:30','Jain Temple'],['13:00','Lunch'],['15:00','Countryside drive'],['18:00','Udaipur old city']],['Day 5 · Slow morning + departure',[['09:00','Badi Lake / viewpoint'],['11:00','Shopping + cafés'],['13:00','Lunch'],['15:00','Departure']]]],pack:['Light jacket','Comfortable shoes','Sunglasses','Sunscreen','Water bottle','Power bank']},goa:{title:'🏖️ Goa',subtitle:'Beaches · sunsets · water fun · nightlife',days:[['Day 1 · North Goa',[['10:00','Check-in'],['12:00','Calangute / Baga area'],['16:30','Beach sunset'],['20:00','Dinner']],['Day 2 · Anjuna + Vagator',[['09:00','Breakfast'],['10:30','Anjuna'],['13:00','Lunch'],['16:00','Vagator sunset'],['20:00','Nightlife / cafés']],['Day 3 · Panaji + Fontainhas',[['09:00','Panaji'],['11:00','Fontainhas walk'],['13:00','Lunch'],['16:00','Mandovi riverfront'],['19:00','Dinner']],['Day 4 · South Goa',[['08:00','Leave for Palolem'],['11:00','Palolem beach'],['14:00','Lunch'],['16:30','Sunset'],['19:00','Return / stay South Goa if preferred']],['Day 5 · Dudhsagar or relaxed beach',[['07:00','Dudhsagar full-day option'],['OR','Relaxed beach + café day'],['17:00','Pack + departure']]]],pack:['Beach clothes','Sandals','Swimwear','Sunscreen','Sunglasses','Light jacket']}};
function show(k,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=plans[k];document.getElementById('content').innerHTML=`<div class="summary"><div class="box"><div>Duration</div><strong>5 days</strong></div><div class="box"><div>Theme</div><strong>${p.subtitle.split(' · ')[0]}</strong></div><div class="box"><div>Packing</div><strong>${p.pack.length} essentials</strong></div></div><div class="days">${p.days.map((d,i)=>`<article class="day ${i===0?'open':''}"><button onclick="this.parentElement.classList.toggle('open')"><span>${d[0]}</span><span>＋</span></button><div class="daybody">${d[1].map(x=>`<div class="time"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}<div style="margin-top:15px;font-weight:950">Day checklist</div><label class="check"><input type="checkbox"> Activities confirmed</label><label class="check"><input type="checkbox"> Transport checked</label><label class="check"><input type="checkbox"> Stay booked</label></div></article>`).join('')}</div><div class="box" style="margin-top:18px"><b>Packing checklist</b>${p.pack.map(x=>`<label class="check"><input type="checkbox"> ${x}</label>`).join('')}</div>`}
show('manali',document.querySelector('.tabs button'));
</script></body></html>
